<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="fio, 4 KiB random reads of a ZFS file in the ARC, by jobs">
<title>fio, 4 KiB random reads of a ZFS file in the ARC, by jobs</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
