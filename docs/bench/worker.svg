<path d="M120.0,244.0 H228.6 Q232.6,244.0 232.6,248.0 V254.0 Q232.6,258.0 228.6,258.0 H120.0 Z" fill="var(--kqueue)"><title>Empty op (NOP) — kqueue: 296 ns</title></path>
<text x="237.6" y="255" class="val">296</text>
<path d="M120.0,260.0 H239.9 Q243.9,260.0 243.9,264.0 V270.0 Q243.9,274.0 239.9,274.0 H120.0 Z" fill="var(--s1)"><title>Empty op (NOP) — kqring, inline: 326 ns</title></path>
<text x="248.9" y="271" class="val">326</text>
<path d="M120.0,276.0 H514.5 Q518.5,276.0 518.5,280.0 V286.0 Q518.5,290.0 514.5,290.0 H120.0 Z" fill="var(--s2)"><title>Empty op (NOP) — kqring, via worker: 1,049 ns</title></path>
<text x="523.5" y="287" class="val">1,049</text>
<line x1="120.0" y1="94" x2="120.0" y2="312" class="axis"/>
</svg>
