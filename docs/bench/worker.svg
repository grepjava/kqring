<path d="M144.0,294.0 H528.2 Q532.2,294.0 532.2,298.0 V304.0 Q532.2,308.0 528.2,308.0 H144.0 Z" fill="var(--s2)"><title>Empty op (NOP) — kqring, via worker: 1,067 ns</title></path>
<text x="537.2" y="305" class="val">1,067</text>
<line x1="144.0" y1="112" x2="144.0" y2="330" class="axis"/>
</svg>
