<path d="M120.0,276.0 H614.3 Q618.3,276.0 618.3,280.0 V286.0 Q618.3,290.0 614.3,290.0 H120.0 Z" fill="var(--s2)"><title>Empty op (NOP) — kqring, via worker: 4,371 ns</title></path>
<text x="623.3" y="287" class="val">4,371</text>
<line x1="120.0" y1="94" x2="120.0" y2="312" class="axis"/>
</svg>
