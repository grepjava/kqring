<text x="362.4" y="346" class="tick" text-anchor="middle">600</text>
<line x1="471.6" y1="112" x2="471.6" y2="330" class="grid"/>
<text x="471.6" y="346" class="tick" text-anchor="middle">900</text>
<line x1="580.8" y1="112" x2="580.8" y2="330" class="grid"/>
<text x="580.8" y="346" class="tick" text-anchor="middle">1,200</text>
