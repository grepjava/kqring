<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="Pipes and files: inline vs worker thread">
<title>Pipes and files: inline vs worker thread</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="360" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">Pipes and files: inline vs worker thread</text>
<text x="20" y="48" class="sub">ns per operation, lower is better; NOP via a worker shows a worker round trip</text>
<rect x="20" y="64" width="10" height="10" rx="2" fill="var(--plain)"/>
<text x="35" y="73" class="lab">read(2) / pread(2)</text>
<rect x="161.0" y="64" width="10" height="10" rx="2" fill="var(--kqueue)"/>
<text x="176.0" y="73" class="lab">kqueue</text>
<rect x="230.0" y="64" width="10" height="10" rx="2" fill="var(--s1)"/>
<text x="245.0" y="73" class="lab">kqring, inline</text>
<rect x="347.0" y="64" width="10" height="10" rx="2" fill="var(--s4)"/>
<text x="362.0" y="73" class="lab">kqring, blocking pipe, inline</text>
<rect x="554.0" y="64" width="10" height="10" rx="2" fill="var(--s2)"/>
<text x="569.0" y="73" class="lab">kqring, via worker</text>
<rect x="20" y="82" width="10" height="10" rx="2" fill="var(--s3)"/>
<text x="35" y="91" class="lab">kqring, inline, 32 per enter</text>
<line x1="144.0" y1="112" x2="144.0" y2="330" class="grid"/>
<text x="144.0" y="346" class="tick" text-anchor="middle">0</text>
<line x1="253.2" y1="112" x2="253.2" y2="330" class="grid"/>
<text x="253.2" y="346" class="tick" text-anchor="middle">200</text>
<line x1="362.4" y1="112" x2="362.4" y2="330" class="grid"/>
<text x="362.4" y="346" class="tick" text-anchor="middle">400</text>
<line x1="471.6" y1="112" x2="471.6" y2="330" class="grid"/>
<text x="471.6" y="346" class="tick" text-anchor="middle">600</text>
<line x1="580.8" y1="112" x2="580.8" y2="330" class="grid"/>
<text x="580.8" y="346" class="tick" text-anchor="middle">800</text>
<line x1="690.0" y1="112" x2="690.0" y2="330" class="grid"/>
<text x="690.0" y="346" class="tick" text-anchor="middle">1,000</text>
<text x="740" y="346" class="tick" text-anchor="end">ns</text>
<text x="134.0" y="153.0" class="lab" text-anchor="end">Pipe READ, 64 B</text>
<path d="M144.0,118.0 H282.0 Q286.0,118.0 286.0,122.0 V128.0 Q286.0,132.0 282.0,132.0 H144.0 Z" fill="var(--plain)"><title>Pipe READ, 64 B — read(2) / pread(2): 260 ns</title></path>
<text x="291.0" y="129" class="val">260</text>
<path d="M144.0,134.0 H378.6 Q382.6,134.0 382.6,138.0 V144.0 Q382.6,148.0 378.6,148.0 H144.0 Z" fill="var(--kqueue)"><title>Pipe READ, 64 B — kqueue: 437 ns</title></path>
<text x="387.6" y="145" class="val">437</text>
<path d="M144.0,150.0 H396.5 Q400.5,150.0 400.5,154.0 V160.0 Q400.5,164.0 396.5,164.0 H144.0 Z" fill="var(--s1)"><title>Pipe READ, 64 B — kqring, inline: 470 ns</title></path>
<text x="405.5" y="161" class="val">470</text>
<path d="M144.0,166.0 H399.7 Q403.7,166.0 403.7,170.0 V176.0 Q403.7,180.0 399.7,180.0 H144.0 Z" fill="var(--s4)"><title>Pipe READ, 64 B — kqring, blocking pipe, inline: 476 ns</title></path>
<text x="408.7" y="177" class="val">476</text>
<text x="134.0" y="225.0" class="lab" text-anchor="end">UFS file READ, 4 KiB</text>
<path d="M144.0,198.0 H581.5 Q585.5,198.0 585.5,202.0 V208.0 Q585.5,212.0 581.5,212.0 H144.0 Z" fill="var(--plain)"><title>UFS file READ, 4 KiB — read(2) / pread(2): 809 ns</title></path>
<text x="590.5" y="209" class="val">809</text>
<path d="M144.0,214.0 H645.0 Q649.0,214.0 649.0,218.0 V224.0 Q649.0,228.0 645.0,228.0 H144.0 Z" fill="var(--s1)"><title>UFS file READ, 4 KiB — kqring, inline: 925 ns</title></path>
<text x="654.0" y="225" class="val">925</text>
<path d="M144.0,230.0 H580.5 Q584.5,230.0 584.5,234.0 V240.0 Q584.5,244.0 580.5,244.0 H144.0 Z" fill="var(--s3)"><title>UFS file READ, 4 KiB — kqring, inline, 32 per enter: 807 ns</title></path>
<text x="589.5" y="241" class="val">807</text>
<text x="134.0" y="289.0" class="lab" text-anchor="end">Empty op (NOP)</text>
<path d="M144.0,262.0 H197.3 Q201.3,262.0 201.3,266.0 V272.0 Q201.3,276.0 197.3,276.0 H144.0 Z" fill="var(--kqueue)"><title>Empty op (NOP) — kqueue: 105 ns</title></path>
<text x="206.3" y="273" class="val">105</text>
<path d="M144.0,278.0 H239.6 Q243.6,278.0 243.6,282.0 V288.0 Q243.6,292.0 239.6,292.0 H144.0 Z" fill="var(--s1)"><title>Empty op (NOP) — kqring, inline: 182 ns</title></path>
<text x="248.6" y="289" class="val">182</text>
<path d="M144.0,294.0 H549.6 Q553.6,294.0 553.6,298.0 V304.0 Q553.6,308.0 549.6,308.0 H144.0 Z" fill="var(--s2)"><title>Empty op (NOP) — kqring, via worker: 750 ns</title></path>
<text x="558.6" y="305" class="val">750</text>
<line x1="144.0" y1="112" x2="144.0" y2="330" class="axis"/>
</svg>
