<text x="359.0" y="111" class="val">616</text>
<path d="M120.0,116.0 H505.3 Q509.3,116.0 509.3,120.0 V126.0 Q509.3,130.0 505.3,130.0 H120.0 Z" fill="var(--kqueue)"><title>Pipe READ, 64 B — kqueue: 1,024 ns</title></path>
<text x="514.3" y="127" class="val">1,024</text>
