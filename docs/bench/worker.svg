<text x="234.0" y="328" class="tick" text-anchor="middle">300</text>
<line x1="348.0" y1="94" x2="348.0" y2="312" class="grid"/>
<text x="348.0" y="328" class="tick" text-anchor="middle">600</text>
<line x1="462.0" y1="94" x2="462.0" y2="312" class="grid"/>
<text x="462.0" y="328" class="tick" text-anchor="middle">900</text>
<line x1="576.0" y1="94" x2="576.0" y2="312" class="grid"/>
<text x="576.0" y="328" class="tick" text-anchor="middle">1,200</text>
