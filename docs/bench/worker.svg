<text x="348.0" y="328" class="tick" text-anchor="middle">2,000</text>
<line x1="462.0" y1="94" x2="462.0" y2="312" class="grid"/>
<text x="462.0" y="328" class="tick" text-anchor="middle">3,000</text>
