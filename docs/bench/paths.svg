<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="368" viewBox="0 0 760 368" role="img" aria-label="What one request costs on each path">
<title>What one request costs on each path</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="368" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">What one request costs on each path</text>
<text x="20" y="48" class="sub">ns per operation, lower is better; socket and pipe rows include the write that feeds them</text>
<line x1="234.0" y1="72" x2="234.0" y2="338" class="grid"/>
<text x="234.0" y="354" class="tick" text-anchor="middle">0</text>
<line x1="325.2" y1="72" x2="325.2" y2="338" class="grid"/>
<text x="325.2" y="354" class="tick" text-anchor="middle">800</text>
<line x1="416.4" y1="72" x2="416.4" y2="338" class="grid"/>
<text x="416.4" y="354" class="tick" text-anchor="middle">1,600</text>
<line x1="507.6" y1="72" x2="507.6" y2="338" class="grid"/>
<text x="507.6" y="354" class="tick" text-anchor="middle">2,400</text>
<line x1="598.8" y1="72" x2="598.8" y2="338" class="grid"/>
<text x="598.8" y="354" class="tick" text-anchor="middle">3,200</text>
<line x1="690.0" y1="72" x2="690.0" y2="338" class="grid"/>
<text x="690.0" y="354" class="tick" text-anchor="middle">4,000</text>
<text x="740" y="354" class="tick" text-anchor="end">ns</text>
<text x="224.0" y="89.0" class="lab" text-anchor="end">NOP, 32 per enter</text>
<path d="M234.0,78.0 H238.1 Q242.1,78.0 242.1,82.0 V88.0 Q242.1,92.0 238.1,92.0 H234.0 Z" fill="var(--s1)"><title>NOP, 32 per enter — ns: 71 ns</title></path>
<text x="247.1" y="89" class="val">71</text>
<text x="224.0" y="121.0" class="lab" text-anchor="end">NOP, one per enter</text>
<path d="M234.0,110.0 H250.8 Q254.8,110.0 254.8,114.0 V120.0 Q254.8,124.0 250.8,124.0 H234.0 Z" fill="var(--s1)"><title>NOP, one per enter — ns: 182 ns</title></path>
<text x="259.8" y="121" class="val">182</text>
<text x="224.0" y="153.0" class="lab" text-anchor="end">Pipe READ, inline</text>
<path d="M234.0,142.0 H284.2 Q288.2,142.0 288.2,146.0 V152.0 Q288.2,156.0 284.2,156.0 H234.0 Z" fill="var(--s1)"><title>Pipe READ, inline — ns: 476 ns</title></path>
<text x="293.2" y="153" class="val">476</text>
<text x="224.0" y="185.0" class="lab" text-anchor="end">RECV, reused buffer</text>
<path d="M234.0,174.0 H291.9 Q295.9,174.0 295.9,178.0 V184.0 Q295.9,188.0 291.9,188.0 H234.0 Z" fill="var(--s1)"><title>RECV, reused buffer — ns: 543 ns</title></path>
<text x="300.9" y="185" class="val">543</text>
<text x="224.0" y="217.0" class="lab" text-anchor="end">NOP through a worker</text>
<path d="M234.0,206.0 H315.5 Q319.5,206.0 319.5,210.0 V216.0 Q319.5,220.0 315.5,220.0 H234.0 Z" fill="var(--s1)"><title>NOP through a worker — ns: 750 ns</title></path>
<text x="324.5" y="217" class="val">750</text>
<text x="224.0" y="249.0" class="lab" text-anchor="end">UFS READ, inline</text>
<path d="M234.0,238.0 H335.4 Q339.4,238.0 339.4,242.0 V248.0 Q339.4,252.0 335.4,252.0 H234.0 Z" fill="var(--s1)"><title>UFS READ, inline — ns: 925 ns</title></path>
<text x="344.4" y="249" class="val">925</text>
<text x="224.0" y="281.0" class="lab" text-anchor="end">RECV armed, then woken by an upcall</text>
<path d="M234.0,270.0 H333.7 Q337.7,270.0 337.7,274.0 V280.0 Q337.7,284.0 333.7,284.0 H234.0 Z" fill="var(--s1)"><title>RECV armed, then woken by an upcall — ns: 910 ns</title></path>
<text x="342.7" y="281" class="val">910</text>
<text x="224.0" y="313.0" class="lab" text-anchor="end">Disk READ, bio to md(4)</text>
<path d="M234.0,302.0 H662.6 Q666.6,302.0 666.6,306.0 V312.0 Q666.6,316.0 662.6,316.0 H234.0 Z" fill="var(--s1)"><title>Disk READ, bio to md(4) — ns: 3,794 ns</title></path>
<text x="671.6" y="313" class="val">3,794</text>
<line x1="234.0" y1="72" x2="234.0" y2="338" class="axis"/>
</svg>
