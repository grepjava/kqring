<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="fio, 4 KiB random reads from md(4) disks, a ring and a disk per thread">
<title>fio, 4 KiB random reads from md(4) disks, a ring and a disk per thread</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="380" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">fio, 4 KiB random reads from md(4) disks, a ring and a disk per thread</text>
<text x="20" y="48" class="sub">Thousands of IOPS, higher is better; 32 in flight per job</text>
<rect x="20" y="66" width="10" height="10" rx="2" fill="var(--kqueue)"/>
<text x="35" y="75" class="lab">aio</text>
<rect x="71.0" y="66" width="10" height="10" rx="2" fill="var(--s1)"/>
<text x="86.0" y="75" class="lab">kqring</text>
<line x1="56" y1="332.0" x2="570" y2="332.0" class="axis"/>
<text x="48" y="336.0" class="tick" text-anchor="end">0k</text>
<line x1="56" y1="284.8" x2="570" y2="284.8" class="grid"/>
<text x="48" y="288.8" class="tick" text-anchor="end">300k</text>
<line x1="56" y1="237.6" x2="570" y2="237.6" class="grid"/>
<text x="48" y="241.6" class="tick" text-anchor="end">600k</text>
<line x1="56" y1="190.4" x2="570" y2="190.4" class="grid"/>
<text x="48" y="194.4" class="tick" text-anchor="end">900k</text>
<line x1="56" y1="143.2" x2="570" y2="143.2" class="grid"/>
<text x="48" y="147.2" class="tick" text-anchor="end">1,200k</text>
<line x1="56" y1="96.0" x2="570" y2="96.0" class="grid"/>
<text x="48" y="100.0" class="tick" text-anchor="end">1,500k</text>
<text x="56.0" y="358" class="tick" text-anchor="middle">1</text>
<text x="313.0" y="358" class="tick" text-anchor="middle">2</text>
<text x="570.0" y="358" class="tick" text-anchor="middle">4</text>
<text x="313.0" y="374" class="tick" text-anchor="middle">jobs</text>
<polyline points="56.0,260.7 313.0,244.2 570.0,281.2" fill="none" stroke="var(--kqueue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="56.0" cy="260.7" r="4" fill="var(--kqueue)" stroke="var(--surface)" stroke-width="2"><title>aio: 453k k IOPS</title></circle>
<circle cx="313.0" cy="244.2" r="4" fill="var(--kqueue)" stroke="var(--surface)" stroke-width="2"><title>aio: 558k k IOPS</title></circle>
<circle cx="570.0" cy="281.2" r="4" fill="var(--kqueue)" stroke="var(--surface)" stroke-width="2"><title>aio: 323k k IOPS</title></circle>
<polyline points="56.0,246.4 313.0,180.2 570.0,169.8" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="56.0" cy="246.4" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>kqring: 544k k IOPS</title></circle>
<circle cx="313.0" cy="180.2" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>kqring: 965k k IOPS</title></circle>
<circle cx="570.0" cy="169.8" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>kqring: 1,031k k IOPS</title></circle>
<text x="580.0" y="173.8" class="val">kqring 1,031k</text>
<text x="580.0" y="285.2" class="val">aio 323k</text>
<text x="740" y="75" class="tick" text-anchor="end">k IOPS</text>
</svg>
