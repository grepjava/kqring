<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="194" viewBox="0 0 760 194" role="img" aria-label="The three target cases after optimization">
<title>The three target cases after optimization</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="194" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">The three target cases after optimization</text>
<text x="20" y="48" class="sub">Median of 5 runs; comparisons: write, kqueue, pread</text>
<line x1="254.8" y1="64" x2="254.8" y2="160" class="grid"/>
<text x="254.8" y="178" class="tick" text-anchor="middle">5× slower</text>
<line x1="369.3" y1="64" x2="369.3" y2="160" class="grid"/>
<text x="369.3" y="178" class="tick" text-anchor="middle">2× slower</text>
<line x1="456.0" y1="64" x2="456.0" y2="160" class="axis"/>
<text x="456.0" y="178" class="tick" text-anchor="middle">same</text>
<line x1="542.7" y1="64" x2="542.7" y2="160" class="grid"/>
<text x="542.7" y="178" class="tick" text-anchor="middle">2× faster</text>
<line x1="657.2" y1="64" x2="657.2" y2="160" class="grid"/>
<text x="657.2" y="178" class="tick" text-anchor="middle">5× faster</text>
<text x="222.0" y="83" class="lab" text-anchor="end">AF_UNIX 16 KiB registered SEND_ZC</text>
<path d="M456.0,70.0 H457.5 Q461.5,70.0 461.5,74.0 V82.0 Q461.5,86.0 457.5,86.0 H456.0 Z" fill="var(--faster)"><title>AF_UNIX 16 KiB registered SEND_ZC: 1.05× faster (1,757 → 1,681 ns)</title></path>
<text x="467.5" y="83" class="val" text-anchor="start">1.05× faster</text>
<text x="222.0" y="109" class="lab" text-anchor="end">AF_UNIX 64 B armed RECV</text>
<path d="M456.0,96.0 H435.1 Q431.1,96.0 431.1,100.0 V108.0 Q431.1,112.0 435.1,112.0 H456.0 Z" fill="var(--slower)"><title>AF_UNIX 64 B armed RECV: 1.22× slower (1,110 → 1,355 ns)</title></path>
<text x="462.0" y="109" class="val" text-anchor="start">1.22× slower</text>
<text x="222.0" y="135" class="lab" text-anchor="end">UFS cached 4 KiB READ</text>
<path d="M456.0,122.0 H446.8 Q442.8,122.0 442.8,126.0 V134.0 Q442.8,138.0 446.8,138.0 H456.0 Z" fill="var(--slower)"><title>UFS cached 4 KiB READ: 1.11× slower (1,202 → 1,336 ns)</title></path>
<text x="462.0" y="135" class="val" text-anchor="start">1.11× slower</text>
</svg>
