<text x="537.5" y="135" class="val" text-anchor="start">1.29× faster</text>
<text x="258.0" y="161" class="lab" text-anchor="end">AF_UNIX 64 B, multishot RECV</text>
<path d="M499.0,148.0 H515.4 Q519.4,148.0 519.4,152.0 V160.0 Q519.4,164.0 515.4,164.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, multishot RECV: 1.17× faster (1,111 → 948 ns)</title></path>
<text x="525.4" y="161" class="val" text-anchor="start">1.17× faster</text>
<text x="258.0" y="187" class="lab" text-anchor="end">AF_UNIX 4 KiB, multishot RECV</text>
