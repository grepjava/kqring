<text x="565.7" y="317" class="val" text-anchor="start">1.60× faster</text>
<text x="258.0" y="343" class="lab" text-anchor="end">TCP 64 KiB send, SEND_ZC vs write</text>
<path d="M499.0,330.0 H517.8 Q521.8,330.0 521.8,334.0 V342.0 Q521.8,346.0 517.8,346.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 KiB send, SEND_ZC vs write: 1.19× faster (13,845 → 11,599 ns)</title></path>
<text x="527.8" y="343" class="val" text-anchor="start">1.19× faster</text>
<text x="258.0" y="369" class="lab" text-anchor="end">AF_UNIX 16 KiB send, SEND_ZC vs write</text>
<path d="M499.0,356.0 H480.9 Q476.9,356.0 476.9,360.0 V368.0 Q476.9,372.0 480.9,372.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 16 KiB send, SEND_ZC vs write: 1.19× slower (1,717 → 2,038 ns)</title></path>
<text x="505.0" y="369" class="val" text-anchor="start">1.19× slower</text>
<text x="258.0" y="395" class="lab" text-anchor="end">AF_UNIX 64 B, RECV armed before data</text>
<path d="M499.0,382.0 H448.4 Q444.4,382.0 444.4,386.0 V394.0 Q444.4,398.0 448.4,398.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 64 B, RECV armed before data: 1.53× slower (1,112 → 1,698 ns)</title></path>
<text x="505.0" y="395" class="val" text-anchor="start">1.53× slower</text>
<text x="258.0" y="421" class="lab" text-anchor="end">File 4 KiB, 32 READs per enter vs pread</text>
<path d="M499.0,408.0 H539.1 Q543.1,408.0 543.1,412.0 V420.0 Q543.1,424.0 539.1,424.0 H499.0 Z" fill="var(--faster)"><title>File 4 KiB, 32 READs per enter vs pread: 1.41× faster (1,097 → 780 ns)</title></path>
<text x="549.1" y="421" class="val" text-anchor="start">1.41× faster</text>
<text x="258.0" y="447" class="lab" text-anchor="end">File 4 KiB READ vs pread</text>
<path d="M499.0,434.0 H475.7 Q471.7,434.0 471.7,438.0 V446.0 Q471.7,450.0 475.7,450.0 H499.0 Z" fill="var(--slower)"><title>File 4 KiB READ vs pread: 1.24× slower (1,097 → 1,356 ns)</title></path>
<text x="505.0" y="447" class="val" text-anchor="start">1.24× slower</text>
<text x="258.0" y="473" class="lab" text-anchor="end">Pipe 64 B READ, O_NONBLOCK</text>
<path d="M499.0,460.0 H508.1 Q512.1,460.0 512.1,464.0 V472.0 Q512.1,476.0 508.1,476.0 H499.0 Z" fill="var(--faster)"><title>Pipe 64 B READ, O_NONBLOCK: 1.11× faster (1,017 → 919 ns)</title></path>
<text x="518.1" y="473" class="val" text-anchor="start">1.11× faster</text>
<text x="258.0" y="499" class="lab" text-anchor="end">Pipe 64 B READ, blocking (worker)</text>
<path d="M499.0,486.0 H285.1 Q281.1,486.0 281.1,490.0 V498.0 Q281.1,502.0 285.1,502.0 H499.0 Z" fill="var(--slower)"><title>Pipe 64 B READ, blocking (worker): 5.42× slower (1,017 → 5,514 ns)</title></path>
<text x="505.0" y="499" class="val" text-anchor="start">5.42× slower</text>
