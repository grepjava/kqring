<text x="550.2" y="421" class="val" text-anchor="start">1.42× faster</text>
<text x="258.0" y="447" class="lab" text-anchor="end">File 4 KiB READ vs pread</text>
<path d="M499.0,434.0 H486.0 Q482.0,434.0 482.0,438.0 V446.0 Q482.0,450.0 486.0,450.0 H499.0 Z" fill="var(--slower)"><title>File 4 KiB READ vs pread: 1.14× slower (1,116 → 1,273 ns)</title></path>
<text x="505.0" y="447" class="val" text-anchor="start">1.14× slower</text>
<text x="258.0" y="473" class="lab" text-anchor="end">Pipe 64 B READ, O_NONBLOCK</text>
<path d="M499.0,460.0 H521.5 Q525.5,460.0 525.5,464.0 V472.0 Q525.5,476.0 521.5,476.0 H499.0 Z" fill="var(--faster)"><title>Pipe 64 B READ, O_NONBLOCK: 1.23× faster (1,024 → 834 ns)</title></path>
<text x="531.5" y="473" class="val" text-anchor="start">1.23× faster</text>
