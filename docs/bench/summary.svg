<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="558" viewBox="0 0 760 558" role="img" aria-label="kqring vs kqueue: speed-up per operation">
<title>kqring vs kqueue: speed-up per operation</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="558" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">kqring vs kqueue: speed-up per operation</text>
<text x="20" y="48" class="sub">Median of 5 runs; baseline is kqueue, or the plain syscall where kqueue has no role</text>
<line x1="291.5" y1="64" x2="291.5" y2="524" class="grid"/>
<text x="291.5" y="542" class="tick" text-anchor="middle">5× slower</text>
<line x1="409.6" y1="64" x2="409.6" y2="524" class="grid"/>
<text x="409.6" y="542" class="tick" text-anchor="middle">2× slower</text>
<line x1="499.0" y1="64" x2="499.0" y2="524" class="axis"/>
<text x="499.0" y="542" class="tick" text-anchor="middle">same</text>
<line x1="588.4" y1="64" x2="588.4" y2="524" class="grid"/>
<text x="588.4" y="542" class="tick" text-anchor="middle">2× faster</text>
<line x1="706.5" y1="64" x2="706.5" y2="524" class="grid"/>
<text x="706.5" y="542" class="tick" text-anchor="middle">5× faster</text>
<text x="258.0" y="83" class="lab" text-anchor="end">Fan-in, 1,024 sockets (multishot RECV)</text>
<path d="M499.0,70.0 H516.1 Q520.1,70.0 520.1,74.0 V82.0 Q520.1,86.0 516.1,86.0 H499.0 Z" fill="var(--faster)"><title>Fan-in, 1,024 sockets (multishot RECV): 1.18× faster (861 → 730 ns)</title></path>
<text x="526.1" y="83" class="val" text-anchor="start">1.18× faster</text>
<text x="258.0" y="109" class="lab" text-anchor="end">Fan-in, 16 sockets (multishot RECV)</text>
<path d="M499.0,96.0 H516.2 Q520.2,96.0 520.2,100.0 V108.0 Q520.2,112.0 516.2,112.0 H499.0 Z" fill="var(--faster)"><title>Fan-in, 16 sockets (multishot RECV): 1.18× faster (828 → 702 ns)</title></path>
<text x="526.2" y="109" class="val" text-anchor="start">1.18× faster</text>
<text x="258.0" y="135" class="lab" text-anchor="end">AF_UNIX 64 B, RECV into one buffer</text>
<path d="M499.0,122.0 H511.2 Q515.2,122.0 515.2,126.0 V134.0 Q515.2,138.0 511.2,138.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, RECV into one buffer: 1.13× faster (1,112 → 981 ns)</title></path>
<text x="521.2" y="135" class="val" text-anchor="start">1.13× faster</text>
<text x="258.0" y="161" class="lab" text-anchor="end">AF_UNIX 64 B, multishot RECV</text>
<path d="M499.0,148.0 H500.6 Q504.6,148.0 504.6,152.0 V160.0 Q504.6,164.0 500.6,164.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, multishot RECV: 1.04× faster (1,112 → 1,065 ns)</title></path>
<text x="510.6" y="161" class="val" text-anchor="start">1.04× faster</text>
<text x="258.0" y="187" class="lab" text-anchor="end">AF_UNIX 4 KiB, multishot RECV</text>
<path d="M499.0,174.0 H494.5 Q490.5,174.0 490.5,178.0 V186.0 Q490.5,190.0 494.5,190.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 4 KiB, multishot RECV: 1.07× slower (1,249 → 1,334 ns)</title></path>
<text x="505.0" y="187" class="val" text-anchor="start">1.07× slower</text>
<text x="258.0" y="213" class="lab" text-anchor="end">TCP 64 B, multishot RECV</text>
<path d="M499.0,200.0 H499.0 Q496.2,200.0 496.2,202.8 V213.2 Q496.2,216.0 499.0,216.0 H499.0 Z" fill="var(--slower)"><title>TCP 64 B, multishot RECV: 1.02× slower (5,897 → 6,028 ns)</title></path>
<text x="505.0" y="213" class="val" text-anchor="start">1.02× slower</text>
<text x="258.0" y="239" class="lab" text-anchor="end">TCP accept (multishot ACCEPT)</text>
<path d="M499.0,226.0 H505.8 Q509.8,226.0 509.8,230.0 V238.0 Q509.8,242.0 505.8,242.0 H499.0 Z" fill="var(--faster)"><title>TCP accept (multishot ACCEPT): 1.09× faster (16,128 → 14,838 ns)</title></path>
<text x="515.8" y="239" class="val" text-anchor="start">1.09× faster</text>
<text x="258.0" y="265" class="lab" text-anchor="end">1 µs timer (TIMEOUT)</text>
<path d="M499.0,252.0 H563.8 Q567.8,252.0 567.8,256.0 V264.0 Q567.8,268.0 563.8,268.0 H499.0 Z" fill="var(--faster)"><title>1 µs timer (TIMEOUT): 1.71× faster (8,660 → 5,078 ns)</title></path>
<text x="573.8" y="265" class="val" text-anchor="start">1.71× faster</text>
<text x="258.0" y="291" class="lab" text-anchor="end">Empty kevent vs 32 NOPs per enter</text>
<path d="M499.0,278.0 H663.6 Q667.6,278.0 667.6,282.0 V290.0 Q667.6,294.0 663.6,294.0 H499.0 Z" fill="var(--faster)"><title>Empty kevent vs 32 NOPs per enter: 3.70× faster (287 → 78 ns)</title></path>
<text x="673.6" y="291" class="val" text-anchor="start">3.70× faster</text>
<text x="258.0" y="317" class="lab" text-anchor="end">AF_UNIX 256 KiB send, SEND_ZC vs write</text>
