<text x="510.6" y="187" class="val" text-anchor="start">1.04× faster</text>
<text x="258.0" y="213" class="lab" text-anchor="end">TCP 64 B, multishot RECV</text>
<path d="M499.0,200.0 H499.0 Q499.8,200.0 499.8,200.8 V215.2 Q499.8,216.0 499.0,216.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 B, multishot RECV: 1.01× faster (5,932 → 5,894 ns)</title></path>
<text x="505.8" y="213" class="val" text-anchor="start">1.01× faster</text>
<text x="258.0" y="239" class="lab" text-anchor="end">TCP accept (multishot ACCEPT)</text>
<path d="M499.0,226.0 H499.0 Q501.0,226.0 501.0,228.0 V240.0 Q501.0,242.0 499.0,242.0 H499.0 Z" fill="var(--faster)"><title>TCP accept (multishot ACCEPT): 1.02× faster (16,297 → 16,047 ns)</title></path>
<text x="507.0" y="239" class="val" text-anchor="start">1.02× faster</text>
<text x="258.0" y="265" class="lab" text-anchor="end">1 µs timer (TIMEOUT)</text>
<path d="M499.0,252.0 H572.7 Q576.7,252.0 576.7,256.0 V264.0 Q576.7,268.0 572.7,268.0 H499.0 Z" fill="var(--faster)"><title>1 µs timer (TIMEOUT): 1.83× faster (8,806 → 4,820 ns)</title></path>
<text x="582.7" y="265" class="val" text-anchor="start">1.83× faster</text>
<text x="258.0" y="291" class="lab" text-anchor="end">Empty kevent vs 32 NOPs per enter</text>
<path d="M499.0,278.0 H689.0 Q693.0,278.0 693.0,282.0 V290.0 Q693.0,294.0 689.0,294.0 H499.0 Z" fill="var(--faster)"><title>Empty kevent vs 32 NOPs per enter: 4.50× faster (289 → 64 ns)</title></path>
<text x="699.0" y="291" class="val" text-anchor="start">4.50× faster</text>
