<path d="M486.0,382.0 H436.8 Q432.8,382.0 432.8,386.0 V394.0 Q432.8,398.0 436.8,398.0 H486.0 Z" fill="var(--slower)"><title>AF_UNIX 16 KiB send, SEND_ZC vs write: 1.63× slower (1,241 → 2,029 ns)</title></path>
<text x="492.0" y="395" class="val" text-anchor="start">1.63× slower</text>
