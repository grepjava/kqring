<text x="550.6" y="265" class="val" text-anchor="start">1.42× faster</text>
<text x="258.0" y="291" class="lab" text-anchor="end">Empty kevent vs 32 NOPs per enter</text>
<path d="M499.0,278.0 H697.3 Q701.3,278.0 701.3,282.0 V290.0 Q701.3,294.0 697.3,294.0 H499.0 Z" fill="var(--faster)"><title>Empty kevent vs 32 NOPs per enter: 4.80× faster (297 → 62 ns)</title></path>
<text x="707.3" y="291" class="val" text-anchor="start">4.80× faster</text>
<text x="258.0" y="317" class="lab" text-anchor="end">AF_UNIX 256 KiB send, SEND_ZC vs write</text>
<path d="M499.0,304.0 H550.8 Q554.8,304.0 554.8,308.0 V316.0 Q554.8,320.0 550.8,320.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 256 KiB send, SEND_ZC vs write: 1.54× faster (25,777 → 16,718 ns)</title></path>
<text x="560.8" y="317" class="val" text-anchor="start">1.54× faster</text>
<text x="258.0" y="343" class="lab" text-anchor="end">TCP 64 KiB send, SEND_ZC vs write</text>
<path d="M499.0,330.0 H518.3 Q522.3,330.0 522.3,334.0 V342.0 Q522.3,346.0 518.3,346.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 KiB send, SEND_ZC vs write: 1.20× faster (13,919 → 11,620 ns)</title></path>
<text x="528.3" y="343" class="val" text-anchor="start">1.20× faster</text>
<text x="258.0" y="369" class="lab" text-anchor="end">AF_UNIX 16 KiB send, SEND_ZC vs write</text>
<path d="M499.0,356.0 H491.5 Q487.5,356.0 487.5,360.0 V368.0 Q487.5,372.0 491.5,372.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 16 KiB send, SEND_ZC vs write: 1.09× slower (1,719 → 1,879 ns)</title></path>
<text x="505.0" y="369" class="val" text-anchor="start">1.09× slower</text>
<text x="258.0" y="395" class="lab" text-anchor="end">AF_UNIX 64 B, RECV armed before data</text>
<path d="M499.0,382.0 H477.7 Q473.7,382.0 473.7,386.0 V394.0 Q473.7,398.0 477.7,398.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 64 B, RECV armed before data: 1.22× slower (1,111 → 1,352 ns)</title></path>
<text x="505.0" y="395" class="val" text-anchor="start">1.22× slower</text>
<text x="258.0" y="421" class="lab" text-anchor="end">File 4 KiB, 32 READs per enter vs pread</text>
<path d="M499.0,408.0 H469.5 Q465.5,408.0 465.5,412.0 V420.0 Q465.5,424.0 469.5,424.0 H499.0 Z" fill="var(--slower)"><title>File 4 KiB, 32 READs per enter vs pread: 1.30× slower (1,684 → 2,184 ns)</title></path>
<text x="505.0" y="421" class="val" text-anchor="start">1.30× slower</text>
<text x="258.0" y="447" class="lab" text-anchor="end">File 4 KiB READ vs pread</text>
<path d="M499.0,434.0 H454.1 Q450.1,434.0 450.1,438.0 V446.0 Q450.1,450.0 454.1,450.0 H499.0 Z" fill="var(--slower)"><title>File 4 KiB READ vs pread: 1.46× slower (1,684 → 2,461 ns)</title></path>
<text x="505.0" y="447" class="val" text-anchor="start">1.46× slower</text>
<text x="258.0" y="473" class="lab" text-anchor="end">Pipe 64 B READ, O_NONBLOCK</text>
<path d="M499.0,460.0 H521.7 Q525.7,460.0 525.7,464.0 V472.0 Q525.7,476.0 521.7,476.0 H499.0 Z" fill="var(--faster)"><title>Pipe 64 B READ, O_NONBLOCK: 1.23× faster (1,021 → 830 ns)</title></path>
