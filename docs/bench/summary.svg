<text x="537.3" y="135" class="val" text-anchor="start">1.29× faster</text>
<text x="258.0" y="161" class="lab" text-anchor="end">AF_UNIX 64 B, multishot RECV</text>
<path d="M499.0,148.0 H520.5 Q524.5,148.0 524.5,152.0 V160.0 Q524.5,164.0 520.5,164.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, multishot RECV: 1.22× faster (1,111 → 912 ns)</title></path>
<text x="530.5" y="161" class="val" text-anchor="start">1.22× faster</text>
<text x="258.0" y="187" class="lab" text-anchor="end">AF_UNIX 4 KiB, multishot RECV</text>
<path d="M499.0,174.0 H500.3 Q504.3,174.0 504.3,178.0 V186.0 Q504.3,190.0 500.3,190.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 4 KiB, multishot RECV: 1.04× faster (1,269 → 1,218 ns)</title></path>
<text x="510.3" y="187" class="val" text-anchor="start">1.04× faster</text>
<text x="258.0" y="213" class="lab" text-anchor="end">TCP 64 B, multishot RECV</text>
<path d="M499.0,200.0 H499.0 Q501.3,200.0 501.3,202.3 V213.7 Q501.3,216.0 499.0,216.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 B, multishot RECV: 1.02× faster (5,928 → 5,823 ns)</title></path>
<text x="507.3" y="213" class="val" text-anchor="start">1.02× faster</text>
<text x="258.0" y="239" class="lab" text-anchor="end">TCP accept (multishot ACCEPT)</text>

<text x="505.1" y="239" class="val" text-anchor="start">1.00× faster</text>
<text x="258.0" y="265" class="lab" text-anchor="end">1 µs timer (TIMEOUT)</text>
