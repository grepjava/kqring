<path d="M486.0,278.0 H524.7 Q528.7,278.0 528.7,282.0 V290.0 Q528.7,294.0 524.7,294.0 H486.0 Z" fill="var(--faster)"><title>Empty kevent vs 32 NOPs per enter: 1.48× faster (105 → 71 ns)</title></path>
<text x="534.7" y="291" class="val" text-anchor="start">1.48× faster</text>
