<text x="505.0" y="369" class="val" text-anchor="start">1.10× slower</text>
<text x="258.0" y="395" class="lab" text-anchor="end">AF_UNIX 64 B, RECV armed before data</text>
<path d="M499.0,382.0 H462.3 Q458.3,382.0 458.3,386.0 V394.0 Q458.3,398.0 462.3,398.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 64 B, RECV armed before data: 1.37× slower (1,111 → 1,523 ns)</title></path>
<text x="505.0" y="395" class="val" text-anchor="start">1.37× slower</text>
<text x="258.0" y="421" class="lab" text-anchor="end">File 4 KiB, 32 READs per enter vs pread</text>
