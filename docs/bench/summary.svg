<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="558" viewBox="0 0 760 558" role="img" aria-label="kqring vs kqueue: speed-up per operation">
<title>kqring vs kqueue: speed-up per operation</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="558" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">kqring vs kqueue: speed-up per operation</text>
<text x="20" y="48" class="sub">Median of 5 runs; baseline is kqueue, or the plain syscall where kqueue has no role</text>
<line x1="291.5" y1="64" x2="291.5" y2="524" class="grid"/>
<text x="291.5" y="542" class="tick" text-anchor="middle">5× slower</text>
<line x1="409.6" y1="64" x2="409.6" y2="524" class="grid"/>
<text x="409.6" y="542" class="tick" text-anchor="middle">2× slower</text>
<line x1="499.0" y1="64" x2="499.0" y2="524" class="axis"/>
<text x="499.0" y="542" class="tick" text-anchor="middle">same</text>
<line x1="588.4" y1="64" x2="588.4" y2="524" class="grid"/>
<text x="588.4" y="542" class="tick" text-anchor="middle">2× faster</text>
<line x1="706.5" y1="64" x2="706.5" y2="524" class="grid"/>
<text x="706.5" y="542" class="tick" text-anchor="middle">5× faster</text>
<text x="258.0" y="83" class="lab" text-anchor="end">Fan-in, 1,024 sockets (multishot RECV)</text>
<path d="M499.0,70.0 H515.6 Q519.6,70.0 519.6,74.0 V82.0 Q519.6,86.0 515.6,86.0 H499.0 Z" fill="var(--faster)"><title>Fan-in, 1,024 sockets (multishot RECV): 1.17× faster (864 → 736 ns)</title></path>
<text x="525.6" y="83" class="val" text-anchor="start">1.17× faster</text>
<text x="258.0" y="109" class="lab" text-anchor="end">Fan-in, 16 sockets (multishot RECV)</text>
<path d="M499.0,96.0 H519.6 Q523.6,96.0 523.6,100.0 V108.0 Q523.6,112.0 519.6,112.0 H499.0 Z" fill="var(--faster)"><title>Fan-in, 16 sockets (multishot RECV): 1.21× faster (828 → 684 ns)</title></path>
<text x="529.6" y="109" class="val" text-anchor="start">1.21× faster</text>
<text x="258.0" y="135" class="lab" text-anchor="end">AF_UNIX 64 B, RECV into one buffer</text>
<path d="M499.0,122.0 H525.2 Q529.2,122.0 529.2,126.0 V134.0 Q529.2,138.0 525.2,138.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, RECV into one buffer: 1.26× faster (1,120 → 886 ns)</title></path>
<text x="535.2" y="135" class="val" text-anchor="start">1.26× faster</text>
<text x="258.0" y="161" class="lab" text-anchor="end">AF_UNIX 64 B, multishot RECV</text>
<path d="M499.0,148.0 H514.2 Q518.2,148.0 518.2,152.0 V160.0 Q518.2,164.0 514.2,164.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, multishot RECV: 1.16× faster (1,120 → 964 ns)</title></path>
<text x="524.2" y="161" class="val" text-anchor="start">1.16× faster</text>
<text x="258.0" y="187" class="lab" text-anchor="end">AF_UNIX 4 KiB, multishot RECV</text>
<path d="M499.0,174.0 H499.0 Q501.5,174.0 501.5,176.5 V187.5 Q501.5,190.0 499.0,190.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 4 KiB, multishot RECV: 1.02× faster (1,262 → 1,238 ns)</title></path>
<text x="507.5" y="187" class="val" text-anchor="start">1.02× faster</text>
<text x="258.0" y="213" class="lab" text-anchor="end">TCP 64 B, multishot RECV</text>
<path d="M499.0,200.0 H499.0 Q497.9,200.0 497.9,201.1 V214.9 Q497.9,216.0 499.0,216.0 H499.0 Z" fill="var(--slower)"><title>TCP 64 B, multishot RECV: 1.01× slower (5,884 → 5,933 ns)</title></path>
<text x="505.0" y="213" class="val" text-anchor="start">1.01× slower</text>
<text x="258.0" y="239" class="lab" text-anchor="end">TCP accept (multishot ACCEPT)</text>
<path d="M499.0,226.0 H499.0 Q500.6,226.0 500.6,227.6 V240.4 Q500.6,242.0 499.0,242.0 H499.0 Z" fill="var(--faster)"><title>TCP accept (multishot ACCEPT): 1.01× faster (16,181 → 15,981 ns)</title></path>
<text x="506.6" y="239" class="val" text-anchor="start">1.01× faster</text>
<text x="258.0" y="265" class="lab" text-anchor="end">1 µs timer (TIMEOUT)</text>
<path d="M499.0,252.0 H567.4 Q571.4,252.0 571.4,256.0 V264.0 Q571.4,268.0 567.4,268.0 H499.0 Z" fill="var(--faster)"><title>1 µs timer (TIMEOUT): 1.75× faster (8,865 → 5,057 ns)</title></path>
<text x="577.4" y="265" class="val" text-anchor="start">1.75× faster</text>
<text x="258.0" y="291" class="lab" text-anchor="end">Empty kevent vs 32 NOPs per enter</text>
<path d="M499.0,278.0 H664.9 Q668.9,278.0 668.9,282.0 V290.0 Q668.9,294.0 664.9,294.0 H499.0 Z" fill="var(--faster)"><title>Empty kevent vs 32 NOPs per enter: 3.73× faster (287 → 77 ns)</title></path>
<text x="674.9" y="291" class="val" text-anchor="start">3.73× faster</text>
<text x="258.0" y="317" class="lab" text-anchor="end">AF_UNIX 256 KiB send, SEND_ZC vs write</text>
<path d="M499.0,304.0 H555.5 Q559.5,304.0 559.5,308.0 V316.0 Q559.5,320.0 555.5,320.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 256 KiB send, SEND_ZC vs write: 1.60× faster (25,547 → 15,984 ns)</title></path>
<text x="565.5" y="317" class="val" text-anchor="start">1.60× faster</text>
<text x="258.0" y="343" class="lab" text-anchor="end">TCP 64 KiB send, SEND_ZC vs write</text>
<path d="M499.0,330.0 H516.6 Q520.6,330.0 520.6,334.0 V342.0 Q520.6,346.0 516.6,346.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 KiB send, SEND_ZC vs write: 1.18× faster (13,745 → 11,622 ns)</title></path>
<text x="526.6" y="343" class="val" text-anchor="start">1.18× faster</text>
<text x="258.0" y="369" class="lab" text-anchor="end">AF_UNIX 16 KiB send, SEND_ZC vs write</text>
<path d="M499.0,356.0 H487.0 Q483.0,356.0 483.0,360.0 V368.0 Q483.0,372.0 487.0,372.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 16 KiB send, SEND_ZC vs write: 1.13× slower (1,724 → 1,952 ns)</title></path>
<text x="505.0" y="369" class="val" text-anchor="start">1.13× slower</text>
<text x="258.0" y="395" class="lab" text-anchor="end">AF_UNIX 64 B, RECV armed before data</text>
<path d="M499.0,382.0 H467.6 Q463.6,382.0 463.6,386.0 V394.0 Q463.6,398.0 467.6,398.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 64 B, RECV armed before data: 1.32× slower (1,120 → 1,474 ns)</title></path>
<text x="505.0" y="395" class="val" text-anchor="start">1.32× slower</text>
<text x="258.0" y="421" class="lab" text-anchor="end">File 4 KiB, 32 READs per enter vs pread</text>
<path d="M499.0,408.0 H536.4 Q540.4,408.0 540.4,412.0 V420.0 Q540.4,424.0 536.4,424.0 H499.0 Z" fill="var(--faster)"><title>File 4 KiB, 32 READs per enter vs pread: 1.38× faster (1,091 → 791 ns)</title></path>
<text x="546.4" y="421" class="val" text-anchor="start">1.38× faster</text>
<text x="258.0" y="447" class="lab" text-anchor="end">File 4 KiB READ vs pread</text>
<path d="M499.0,434.0 H484.4 Q480.4,434.0 480.4,438.0 V446.0 Q480.4,450.0 484.4,450.0 H499.0 Z" fill="var(--slower)"><title>File 4 KiB READ vs pread: 1.16× slower (1,091 → 1,260 ns)</title></path>
<text x="505.0" y="447" class="val" text-anchor="start">1.16× slower</text>
<text x="258.0" y="473" class="lab" text-anchor="end">Pipe 64 B READ, O_NONBLOCK</text>
<path d="M499.0,460.0 H521.7 Q525.7,460.0 525.7,464.0 V472.0 Q525.7,476.0 521.7,476.0 H499.0 Z" fill="var(--faster)"><title>Pipe 64 B READ, O_NONBLOCK: 1.23× faster (1,019 → 828 ns)</title></path>
<text x="531.7" y="473" class="val" text-anchor="start">1.23× faster</text>
<text x="258.0" y="499" class="lab" text-anchor="end">Pipe 64 B READ, blocking (worker)</text>
<path d="M499.0,486.0 H287.8 Q283.8,486.0 283.8,490.0 V498.0 Q283.8,502.0 287.8,502.0 H499.0 Z" fill="var(--slower)"><title>Pipe 64 B READ, blocking (worker): 5.31× slower (1,019 → 5,410 ns)</title></path>
<text x="505.0" y="499" class="val" text-anchor="start">5.31× slower</text>
