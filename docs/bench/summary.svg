<text x="492.0" y="369" class="val" text-anchor="start">1.09× slower</text>
<text x="282.0" y="395" class="lab" text-anchor="end">AF_UNIX 16 KiB send, SEND_ZC vs write</text>
<path d="M486.0,382.0 H435.2 Q431.2,382.0 431.2,386.0 V394.0 Q431.2,398.0 435.2,398.0 H486.0 Z" fill="var(--slower)"><title>AF_UNIX 16 KiB send, SEND_ZC vs write: 1.66× slower (1,245 → 2,065 ns)</title></path>
<text x="492.0" y="395" class="val" text-anchor="start">1.66× slower</text>
