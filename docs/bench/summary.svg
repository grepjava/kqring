<text x="486.0" y="620" class="tick" text-anchor="middle">same</text>
<line x1="561.0" y1="64" x2="561.0" y2="602" class="grid"/>
<text x="561.0" y="620" class="tick" text-anchor="middle">2× faster</text>
<line x1="660.3" y1="64" x2="660.3" y2="602" class="grid"/>
<text x="660.3" y="620" class="tick" text-anchor="middle">5× faster</text>
<text x="282.0" y="83" class="lab" text-anchor="end">Fan-in, 1,024 sockets (multishot RECV)</text>
