<text x="567.0" y="317" class="val" text-anchor="start">1.62× faster</text>
<text x="258.0" y="343" class="lab" text-anchor="end">TCP 64 KiB send, SEND_ZC vs write</text>
<path d="M499.0,330.0 H519.3 Q523.3,330.0 523.3,334.0 V342.0 Q523.3,346.0 519.3,346.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 KiB send, SEND_ZC vs write: 1.21× faster (13,892 → 11,508 ns)</title></path>
<text x="529.3" y="343" class="val" text-anchor="start">1.21× faster</text>
<text x="258.0" y="369" class="lab" text-anchor="end">AF_UNIX 16 KiB send, SEND_ZC vs write</text>
