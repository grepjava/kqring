<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="532" viewBox="0 0 760 532" role="img" aria-label="kqring vs kqueue: speed-up per operation">
<title>kqring vs kqueue: speed-up per operation</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="532" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">kqring vs kqueue: speed-up per operation</text>
<text x="20" y="48" class="sub">Median of 5 runs; baseline is kqueue, or the plain syscall where kqueue has no role</text>
<line x1="291.5" y1="64" x2="291.5" y2="498" class="grid"/>
<text x="291.5" y="516" class="tick" text-anchor="middle">5× slower</text>
<line x1="409.6" y1="64" x2="409.6" y2="498" class="grid"/>
<text x="409.6" y="516" class="tick" text-anchor="middle">2× slower</text>
<line x1="499.0" y1="64" x2="499.0" y2="498" class="axis"/>
<text x="499.0" y="516" class="tick" text-anchor="middle">same</text>
<line x1="588.4" y1="64" x2="588.4" y2="498" class="grid"/>
<text x="588.4" y="516" class="tick" text-anchor="middle">2× faster</text>
<line x1="706.5" y1="64" x2="706.5" y2="498" class="grid"/>
<text x="706.5" y="516" class="tick" text-anchor="middle">5× faster</text>
<text x="258.0" y="83" class="lab" text-anchor="end">Fan-in, 1,024 sockets (multishot RECV)</text>
<path d="M499.0,70.0 H516.4 Q520.4,70.0 520.4,74.0 V82.0 Q520.4,86.0 516.4,86.0 H499.0 Z" fill="var(--faster)"><title>Fan-in, 1,024 sockets (multishot RECV): 1.18× faster (860 → 728 ns)</title></path>
<text x="526.4" y="83" class="val" text-anchor="start">1.18× faster</text>
<text x="258.0" y="109" class="lab" text-anchor="end">Fan-in, 16 sockets (multishot RECV)</text>
<path d="M499.0,96.0 H516.4 Q520.4,96.0 520.4,100.0 V108.0 Q520.4,112.0 516.4,112.0 H499.0 Z" fill="var(--faster)"><title>Fan-in, 16 sockets (multishot RECV): 1.18× faster (828 → 702 ns)</title></path>
<text x="526.4" y="109" class="val" text-anchor="start">1.18× faster</text>
<text x="258.0" y="135" class="lab" text-anchor="end">AF_UNIX 64 B, RECV into one buffer</text>
<path d="M499.0,122.0 H512.0 Q516.0,122.0 516.0,126.0 V134.0 Q516.0,138.0 512.0,138.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, RECV into one buffer: 1.14× faster (1,113 → 976 ns)</title></path>
<text x="522.0" y="135" class="val" text-anchor="start">1.14× faster</text>
<text x="258.0" y="161" class="lab" text-anchor="end">AF_UNIX 64 B, multishot RECV</text>
<path d="M499.0,148.0 H500.7 Q504.7,148.0 504.7,152.0 V160.0 Q504.7,164.0 500.7,164.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 64 B, multishot RECV: 1.05× faster (1,113 → 1,065 ns)</title></path>
<text x="510.7" y="161" class="val" text-anchor="start">1.05× faster</text>
<text x="258.0" y="187" class="lab" text-anchor="end">AF_UNIX 4 KiB, multishot RECV</text>
<path d="M499.0,174.0 H494.3 Q490.3,174.0 490.3,178.0 V186.0 Q490.3,190.0 494.3,190.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 4 KiB, multishot RECV: 1.07× slower (1,250 → 1,337 ns)</title></path>
<text x="505.0" y="187" class="val" text-anchor="start">1.07× slower</text>
<text x="258.0" y="213" class="lab" text-anchor="end">TCP 64 B, multishot RECV</text>
<path d="M499.0,200.0 H499.0 Q495.4,200.0 495.4,203.6 V212.4 Q495.4,216.0 499.0,216.0 H499.0 Z" fill="var(--slower)"><title>TCP 64 B, multishot RECV: 1.03× slower (5,897 → 6,065 ns)</title></path>
<text x="505.0" y="213" class="val" text-anchor="start">1.03× slower</text>
<text x="258.0" y="239" class="lab" text-anchor="end">TCP accept (multishot ACCEPT)</text>
<path d="M499.0,226.0 H504.8 Q508.8,226.0 508.8,230.0 V238.0 Q508.8,242.0 504.8,242.0 H499.0 Z" fill="var(--faster)"><title>TCP accept (multishot ACCEPT): 1.08× faster (16,022 → 14,848 ns)</title></path>
<text x="514.8" y="239" class="val" text-anchor="start">1.08× faster</text>
<text x="258.0" y="265" class="lab" text-anchor="end">1 µs timer (TIMEOUT)</text>
<path d="M499.0,252.0 H563.8 Q567.8,252.0 567.8,256.0 V264.0 Q567.8,268.0 563.8,268.0 H499.0 Z" fill="var(--faster)"><title>1 µs timer (TIMEOUT): 1.71× faster (8,595 → 5,040 ns)</title></path>
<text x="573.8" y="265" class="val" text-anchor="start">1.71× faster</text>
<text x="258.0" y="291" class="lab" text-anchor="end">Empty kevent vs 32 NOPs per enter</text>
<path d="M499.0,278.0 H663.7 Q667.7,278.0 667.7,282.0 V290.0 Q667.7,294.0 663.7,294.0 H499.0 Z" fill="var(--faster)"><title>Empty kevent vs 32 NOPs per enter: 3.70× faster (287 → 78 ns)</title></path>
<text x="673.7" y="291" class="val" text-anchor="start">3.70× faster</text>
<text x="258.0" y="317" class="lab" text-anchor="end">AF_UNIX 256 KiB send, SEND_ZC vs write</text>
<path d="M499.0,304.0 H550.3 Q554.3,304.0 554.3,308.0 V316.0 Q554.3,320.0 550.3,320.0 H499.0 Z" fill="var(--faster)"><title>AF_UNIX 256 KiB send, SEND_ZC vs write: 1.54× faster (25,606 → 16,670 ns)</title></path>
<text x="560.3" y="317" class="val" text-anchor="start">1.54× faster</text>
<text x="258.0" y="343" class="lab" text-anchor="end">TCP 64 KiB send, SEND_ZC vs write</text>
<path d="M499.0,330.0 H515.9 Q519.9,330.0 519.9,334.0 V342.0 Q519.9,346.0 515.9,346.0 H499.0 Z" fill="var(--faster)"><title>TCP 64 KiB send, SEND_ZC vs write: 1.18× faster (13,663 → 11,621 ns)</title></path>
<text x="525.9" y="343" class="val" text-anchor="start">1.18× faster</text>
<text x="258.0" y="369" class="lab" text-anchor="end">AF_UNIX 64 B, RECV armed before data</text>
<path d="M499.0,356.0 H445.7 Q441.7,356.0 441.7,360.0 V368.0 Q441.7,372.0 445.7,372.0 H499.0 Z" fill="var(--slower)"><title>AF_UNIX 64 B, RECV armed before data: 1.56× slower (1,113 → 1,736 ns)</title></path>
<text x="505.0" y="369" class="val" text-anchor="start">1.56× slower</text>
<text x="258.0" y="395" class="lab" text-anchor="end">File 4 KiB, 32 READs per enter vs pread</text>
<path d="M499.0,382.0 H539.7 Q543.7,382.0 543.7,386.0 V394.0 Q543.7,398.0 539.7,398.0 H499.0 Z" fill="var(--faster)"><title>File 4 KiB, 32 READs per enter vs pread: 1.41× faster (1,115 → 788 ns)</title></path>
<text x="549.7" y="395" class="val" text-anchor="start">1.41× faster</text>
<text x="258.0" y="421" class="lab" text-anchor="end">File 4 KiB READ vs pread</text>
<path d="M499.0,408.0 H477.3 Q473.3,408.0 473.3,412.0 V420.0 Q473.3,424.0 477.3,424.0 H499.0 Z" fill="var(--slower)"><title>File 4 KiB READ vs pread: 1.22× slower (1,115 → 1,361 ns)</title></path>
<text x="505.0" y="421" class="val" text-anchor="start">1.22× slower</text>
<text x="258.0" y="447" class="lab" text-anchor="end">Pipe 64 B READ, O_NONBLOCK</text>
<path d="M499.0,434.0 H507.8 Q511.8,434.0 511.8,438.0 V446.0 Q511.8,450.0 507.8,450.0 H499.0 Z" fill="var(--faster)"><title>Pipe 64 B READ, O_NONBLOCK: 1.10× faster (1,019 → 923 ns)</title></path>
<text x="517.8" y="447" class="val" text-anchor="start">1.10× faster</text>
<text x="258.0" y="473" class="lab" text-anchor="end">Pipe 64 B READ, blocking (worker)</text>
<path d="M499.0,460.0 H285.2 Q281.2,460.0 281.2,464.0 V472.0 Q281.2,476.0 285.2,476.0 H499.0 Z" fill="var(--slower)"><title>Pipe 64 B READ, blocking (worker): 5.41× slower (1,019 → 5,517 ns)</title></path>
<text x="505.0" y="473" class="val" text-anchor="start">5.41× slower</text>
</svg>
