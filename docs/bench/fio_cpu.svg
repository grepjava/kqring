<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="760" height="278" viewBox="0 0 760 278" role="img" aria-label="fio on a SATA SSD: CPU for the same work, 32 in flight">
<title>fio on a SATA SSD: CPU for the same work, 32 in flight</title>

<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
         --grid:#e1e0d9; --axis:#c3c2b7; --plain:#a8a69e; --kqueue:#eb6834;
         --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
         --faster:#2a78d6; --slower:#e34948; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
           --grid:#2c2c2a; --axis:#383835; --plain:#6f6d67; --kqueue:#d95926;
           --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#d55181;
           --faster:#3987e5; --slower:#e66767; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .title { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12px; fill: var(--ink2); }
  .lab { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 11px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>

<rect width="760" height="278" rx="8" fill="var(--surface)"/>
<text x="20" y="28" class="title">fio on a SATA SSD: CPU for the same work, 32 in flight</text>
<text x="20" y="48" class="sub">Percent of one CPU, lower is better; IOPS within 5% of each other</text>
<rect x="20" y="64" width="10" height="10" rx="2" fill="var(--kqueue)"/>
<text x="35" y="73" class="lab">aio</text>
<rect x="71.0" y="64" width="10" height="10" rx="2" fill="var(--s1)"/>
<text x="86.0" y="73" class="lab">kqring</text>
<line x1="114.0" y1="94" x2="114.0" y2="248" class="grid"/>
<text x="114.0" y="264" class="tick" text-anchor="middle">0%</text>
<line x1="229.2" y1="94" x2="229.2" y2="248" class="grid"/>
<text x="229.2" y="264" class="tick" text-anchor="middle">20%</text>
