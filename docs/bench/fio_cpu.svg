<text x="344.4" y="264" class="tick" text-anchor="middle">40%</text>
<line x1="459.6" y1="94" x2="459.6" y2="248" class="grid"/>
<text x="459.6" y="264" class="tick" text-anchor="middle">60%</text>
<line x1="574.8" y1="94" x2="574.8" y2="248" class="grid"/>
<text x="574.8" y="264" class="tick" text-anchor="middle">80%</text>
<line x1="690.0" y1="94" x2="690.0" y2="248" class="grid"/>
<text x="690.0" y="264" class="tick" text-anchor="middle">100%</text>
<text x="740" y="264" class="tick" text-anchor="end">% CPU</text>
<text x="104.0" y="119.0" class="lab" text-anchor="end">Raw disk reads</text>
<path d="M114.0,100.0 H668.7 Q672.7,100.0 672.7,104.0 V110.0 Q672.7,114.0 668.7,114.0 H114.0 Z" fill="var(--kqueue)"><title>Raw disk reads — aio: 97% % CPU</title></path>
<text x="677.7" y="111" class="val">97%</text>
<path d="M114.0,116.0 H369.2 Q373.2,116.0 373.2,120.0 V126.0 Q373.2,130.0 369.2,130.0 H114.0 Z" fill="var(--s1)"><title>Raw disk reads — kqring: 45% % CPU</title></path>
