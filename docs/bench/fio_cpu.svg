<text x="291.8" y="207" class="val">30%</text>
<path d="M114.0,212.0 H190.6 Q194.6,212.0 194.6,216.0 V222.0 Q194.6,226.0 190.6,226.0 H114.0 Z" fill="var(--s1)"><title>ZFS file writes — kqring: 14% % CPU</title></path>
<text x="199.6" y="223" class="val">14%</text>
<line x1="114.0" y1="94" x2="114.0" y2="248" class="axis"/>
</svg>
