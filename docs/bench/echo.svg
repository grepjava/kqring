<text x="690.0" y="312" class="tick" text-anchor="middle">3,000</text>
<text x="740" y="312" class="tick" text-anchor="end">ns</text>
<text x="92.0" y="127.0" class="lab" text-anchor="end">AF_UNIX 64 B</text>
