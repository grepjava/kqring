<text x="242.0" y="73" class="lab">kqring, io_uring style</text>
<rect x="392.0" y="64" width="10" height="10" rx="2" fill="var(--s2)"/>
<text x="407.0" y="73" class="lab">kqring trigger, no CQE per message</text>
